name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775cbe2231b3d6f6aa4991df5ba7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /study-planner/
          # Use the same public production API URL as Vercel unless overridden by a repo variable.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://study-planner-two-murex.vercel.app/api' }}
          # Google sign-in also needs the public web client ID at build time.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '271491864203-jdrhu2gvdvudd3omut7eu9lg26503cbf.apps.googleusercontent.com' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@834a451ee936565eba54c18ad4c41b94edd60b8d
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@65b5cbe0436925eee41d2b4e9ae32e202658b210
